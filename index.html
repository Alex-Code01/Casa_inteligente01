<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casa Inteligente</title>

    <style>
        body {
            background: #5c3383;
            color: white;
            font-family: Arial;
            text-align: center;
            display: flex;
            
        }

        .painel {
            width: 320px;
            margin: 30px auto;
            padding: 20px;
            background: #204a50;
            border-radius: 15px;
        }

        /* Imagem JPEG */
        .foto {
            width: 100%;
            height: 100px;
            object-fit: cover;
            border-radius: 10px;
        }

        /* Imagem SVG */
        .icone {
            width: 40px;
        }

        /* Imagem PNG */
        .logo {
            width: 70px;
        }

        /* Imagem GIF */
        .gif {
            width: 35px;
            border-radius: 50%;
        }

        button {
            background: #0569ec;
            color: #142238;
            padding: 12px 25px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #0a4f9c;
        }
    </style>
</head>

<body>

    <div class="painel">

        <h2>Minha Casa Inteligente</h2>

        <!-- JPEG: fotografia da sala -->
        <img src="img/sala.jpg" class="foto" alt="Sala de estar">

        <br><br>

        <!-- SVG: ícone vetorial -->
        <img src="img/lampada.svg" class="icone" alt="Ícone de lâmpada">

        <h1>Luz da sala</h1>

        <!-- PNG: imagem com transparência -->
        <img src="img/lampada.png" id="lampada" class="logo" alt="Ilustração de lâmpada">

        <br>

        <!-- GIF: imagem animada -->
        <img src="img/brilho.gif" class="gif" alt="Brilho animado">

        <br><br>

        <button onclick="ligarLuz()">Ligar Luz</button>
        <button onclick="desligarLuz()">Desligar Luz</button>

        <p id="resultado">Luz desligada</p>

    </div>

    <script>
        function ligar() {
            document.getElementById("resultado").innerHTML =
                "Luz ligada!";
        }

        function ligarLuz() {
            document.getElementById("lampada").src = "img/lampada.png";
            document.getElementById("resultado").innerHTML =
                "Luz ligada!";
        }

        function desligarLuz() {
            document.getElementById("lampada").src = "img/lampadaapagada.png";
            document.getElementById("resultado").innerHTML =
                "Luz desligada!";
        }
    </script>

</body>
</html>
